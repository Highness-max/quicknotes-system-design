<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes — API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Talk to the JSONPlaceholder practice API.</p>
    </header>

    <main>
      <section>
        <h2>Load notes</h2>
        <button id="load-btn" type="button">Load notes</button>
      </section>

      <section>
        <h2>Create a note</h2>
        <form id="note-form">
          <p>
            <label for="title-input">Title</label>
            <input
              type="text"
              id="title-input"
              name="title"
              maxlength="100"
              required
            />
          </p>

          <p>
            <label for="body-input">Body (optional)</label>
            <textarea id="body-input" name="body" rows="4"></textarea>
          </p>

          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>

      <section>
        <h2>Status</h2>
        <p id="status"></p>
      </section>

      <section>
        <h2>Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. System design capstone.</p>
    </footer>
  </body>
</html>
